# Render blueprint for RE-SEND. Defines ONE web service (the API, which also
# serves the built front end) and managed PostgreSQL. A single origin means the
# session cookie and the live-updates WebSocket need no cross-origin handling —
# the browser talks to exactly one host. Everything runs on PAID, always-on
# instances: Render's free tier spins services down after inactivity, which drops
# the WebSocket connection and the Postgres LISTEN, breaking live updates.
#
# This blueprint is configured for the DEMONSTRATION deployment (DEMO_MODE on,
# so the system can be shown without a Microsoft tenant). DEMO_MODE must never
# run under NODE_ENV=production — the app fails startup if it does — so the demo
# service runs with NODE_ENV=development. A real production deployment would set
# NODE_ENV=production, DEMO_MODE=false, and wire single sign-on.

databases:
  - name: resend-db
    # A paid plan: always-on, and includes automated DAILY backups plus
    # point-in-time recovery. See docs/disaster-recovery.md for the restore.
    plan: basic-256mb
    databaseName: resend
    postgresMajorVersion: '16'
    region: frankfurt

services:
  # --- API + front end (one service, one origin) ----------------------------
  - type: web
    name: resend
    runtime: node
    plan: starter # paid, always-on — required for WebSockets / live updates
    region: frankfurt
    # Build the front end into apps/web/dist; the API serves it at the root.
    buildCommand: npm ci && npm run build -w @re-send/web
    startCommand: npm run start -w @re-send/api
    # Migrations run as a PRE-DEPLOY step, before the new version serves
    # traffic — never on application boot.
    preDeployCommand: npm run db:migrate -w @re-send/api
    # Readiness, not just liveness: this endpoint checks the database is
    # reachable, so a process that cannot reach Postgres is marked unhealthy.
    healthCheckPath: /health/ready
    # Document bytes are written under UPLOAD_DIR. A persistent disk keeps them
    # across deploys (the container filesystem is otherwise ephemeral).
    disk:
      name: resend-uploads
      mountPath: /var/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: development # demo deployment; see the note at the top of this file
      - key: DATABASE_URL
        fromDatabase:
          name: resend-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: DEMO_MODE
        value: 'true'
      - key: DEMO_PASSWORD
        sync: false # set in the Render dashboard
      - key: ANTHROPIC_API_KEY
        sync: false # set in the Render dashboard; never committed
      - key: AI_ENABLED
        value: 'true'
      - key: STORAGE_PROVIDER
        value: local
      - key: UPLOAD_DIR
        value: /var/uploads
      - key: LOG_LEVEL
        value: info
    # Security headers (Helmet) and the Content-Security-Policy are set by the
    # API in apps/api/src/server.ts and apply to the served front end too.
